# =============================================================================
# 安装方法：把这个文件复制成 .github/workflows/ 下的任意名字并提交（新增文件，不改上游任何文件）。
#
#   mkdir -p .github/workflows
#   cp mishka-custom/ci/build-release.yml .github/workflows/build-release.yml
#   git add .github/workflows/build-release.yml mishka-custom && git commit -m "ci: 只构建 release 的自定义工作流" && git push
#
# 它做的事：拉代码 → 备好子模块/scripta → 装 JDK 21 / Go / Gradle → 用 mishka-custom/scripts/setup.sh
# 应用 app 补丁（锚点面板 + 可视化配置；r14 起不换内核，内核用上游子模块原样构建）→
# 只跑 :app:assembleRelease → 上传 APK；打 tag（v*）时再附到 Release 上。**全程不碰 debug 变体。**
#
# 签名：仓库 secrets 里有 KEYSTORE_BASE64 / KEYSTORE_PASS / KEY_ALIAS / KEY_PASSWORD 就用你的 keystore；
#       没有则用固定参数的 Android debug 风格 keystore 兜底（能直接装、能覆盖升级，但密钥是公开的，
#       换用正式 keystore 后需要卸载重装）。
#
# 两个前置条件（都有明确报错，不会静默）：
#   1. mishka-custom/ 必须**作为普通目录**提交（不能是空的/子模块指针）；
#   2. scripta 子模块或源码必须可得 —— fork 里丢了子模块条目时，用工作流内置逻辑按上游 pin 直接 clone。
# =============================================================================
name: Release APK (anchor panel + visual config)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: "custom-release-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  release:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # 不在 checkout 阶段自动拉子模块：mihomo 与 scripta 各自在下面用带兜底的步骤准备，
          # 避免 fork 里某个子模块 gitlink 损坏时整个 checkout 直接失败。
          submodules: false

      - name: 检查 mishka-custom 是否齐全
        run: |
          set -uo pipefail
          if [ ! -e mishka-custom ]; then
            echo "::error::仓库里没有 mishka-custom/：它必须被提交（git add mishka-custom 后 push）。清单见 README.md「提交到仓库的文件清单」。"
            exit 1
          fi
          if [ ! -f mishka-custom/scripts/setup.sh ]; then
            if [ -d mishka-custom ] && [ -z "$(ls -A mishka-custom)" ]; then
              echo "::error::mishka-custom/ 是个空目录 —— 它被提交成了「子模块指针（gitlink）」而不是普通目录。"
              echo "修复（本地仓库里执行）："
              echo "  rm -rf mishka-custom/.git"
              echo "  git rm --cached mishka-custom -r"
              echo "  git add mishka-custom && git commit -m 'fix: mishka-custom 改为普通目录' && git push"
            else
              echo "::error::mishka-custom/scripts/setup.sh 不存在：mishka-custom 上传不完整。"
            fi
            echo "--- 实际内容 ---"
            ls -la mishka-custom || true
            exit 1
          fi
          missing=""
          for f in scripts/lib.sh init/no-debug.init.gradle \
                   patches/app/0001-anchor-panel.patch patches/app/BASELINE.txt; do
            [ -e "mishka-custom/$f" ] || missing="${missing}
            - mishka-custom/$f"
          done
          if [ -n "$missing" ]; then
            echo "::error::mishka-custom/ 里缺下面这些文件（CI 构建需要，重新上传整个目录即可）：$missing"
            exit 1
          fi
          echo "mishka-custom/ 齐全 ✓"
          find mishka-custom -maxdepth 2 -type d | sort

      - name: 准备 mihomo 内核源码（上游子模块，go.mod replace 需要）
        run: |
          set -uo pipefail
          # mishka_core/go.mod 里有 replace github.com/metacubex/mihomo => ../../../../../mihomo，
          # 顶层 mihomo/ 必须有内核源码，否则 :app 的 Go 交叉编译直接失败。r14 起不换内核，
          # 就用上游 pin 的 YuKongA/mihomo(Mishka 分支)。
          ok=0
          if git ls-files -s mihomo | grep -q '^160000'; then
            echo "走子模块检出 mihomo"
            if git submodule update --init mihomo; then ok=1; fi
          fi
          if [ "$ok" != "1" ]; then
            echo "::warning::mihomo 子模块条目缺失或检出失败，按上游 pin 兜底 clone"
            git fetch --depth=1 --no-tags https://github.com/YuKongA/Mishka.git main
            pin="$(git ls-tree FETCH_HEAD mihomo | awk '{print $3}')"
            echo "mihomo pin = $pin"
            rm -rf mihomo
            git clone --no-checkout https://github.com/YuKongA/mihomo.git mihomo
            git -C mihomo checkout "$pin"
          fi
          if [ -n "$(ls -A mihomo 2>/dev/null)" ]; then
            echo "mihomo 源码就位 ✓（$(git -C mihomo rev-parse --short HEAD 2>/dev/null || echo '?')）"
          else
            echo "::error::mihomo 源码没准备好，Go 编译会失败"
            exit 1
          fi

      - name: 准备 scripta 源码
        run: |
          set -euo pipefail
          # settings.gradle.kts 里有 includeBuild("scripta")，没有它构建直接失败。
          if [ -f mishka-custom/scripts/prepare-scripta.sh ]; then
            bash mishka-custom/scripts/prepare-scripta.sh --repo .
            exit 0
          fi
          echo "::warning::mishka-custom/scripts/prepare-scripta.sh 不在（老版本上传？），改用工作流内置逻辑"
          if git ls-files -s scripta | grep -q '^160000'; then
            echo "走子模块检出"
            git submodule update --init --recursive scripta
            exit 0
          fi
          echo "fork 里没有 scripta 子模块条目：按上游 pin 直接 clone"
          git fetch --depth=1 --no-tags https://github.com/YuKongA/Mishka.git main
          pin="$(git ls-tree FETCH_HEAD scripta | awk '{print $3}')"
          echo "scripta pin = $pin"
          rm -rf scripta
          git clone --no-checkout https://github.com/YuKongA/scripta.git scripta
          git -C scripta checkout "$pin"
          echo "/scripta/" >> .git/info/exclude

      - name: 确保 gradlew 可执行
        run: |
          set -uo pipefail
          if [ -f gradlew ]; then
            mode="$(stat -c '%a' gradlew)"
            if [ "$mode" != "755" ] && [ "$mode" != "775" ]; then
              echo "::warning::gradlew 在仓库里的权限位是 $mode（上游是 755）。CI 里已临时 chmod +x，但请在本地修掉，否则每次都会警告："
              echo "::warning::  chmod +x gradlew && git update-index --chmod=+x gradlew && git commit -m 'fix: 恢复 gradlew 可执行位'"
            fi
            chmod +x gradlew
            ls -l gradlew
          else
            echo "::error::没有 gradlew：仓库不完整（上游有 247 个文件，你的 fork 只有 265 个且缺 .github/workflows/build.yml，建议按 mishka-custom/BUILD.md 重新 fork）"
            exit 1
          fi

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: zulu

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: app/src/main/native/mishka_core/go.mod
          cache-dependency-path: |
            app/src/main/native/mishka_core/go.sum

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: 应用 app 补丁（锚点面板 + 可视化配置）
        run: bash mishka-custom/scripts/setup.sh --ci --repo .

      - name: 准备签名
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            ks="$RUNNER_TEMP/release.jks"
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$ks"
            {
              echo "KEYSTORE_PATH=$ks"
              echo "KEYSTORE_PASS=$KEYSTORE_PASS"
              echo "KEY_ALIAS=${KEY_ALIAS:-mishka}"
              echo "KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASS}"
            } >> "$GITHUB_ENV"
            echo "使用仓库 secrets 里的 keystore 签名" >> "$GITHUB_STEP_SUMMARY"
          else
            ks="$RUNNER_TEMP/debug-key.jks"
            keytool -genkeypair -keystore "$ks" -storetype PKCS12 \
              -alias androiddebugkey -storepass android -keypass android \
              -keyalg RSA -keysize 2048 -validity 10950 \
              -dname "CN=Android Debug,O=Android,C=US" >/dev/null
            {
              echo "KEYSTORE_PATH=$ks"
              echo "KEYSTORE_PASS=android"
              echo "KEY_ALIAS=androiddebugkey"
              echo "KEY_PASSWORD=android"
            } >> "$GITHUB_ENV"
            {
              echo "⚠️ 没有配置 KEYSTORE_BASE64，本次用固定的 debug 风格 keystore 签名：能直接安装、也能覆盖升级，"
              echo "但私钥是公开的，不适合对外分发。配置 secrets 换正式 keystore 后，用户需要先卸载再安装。"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Download GeoIP files
        run: ./gradlew :app:downloadGeoFiles

      - name: Build Release APK（release only）
        run: |
          set -euo pipefail
          # r14 起内核走上游子模块，不再注入 -Pmihomo.version（上游版本串即真实内核版本）。
          ./gradlew -I mishka-custom/init/no-debug.init.gradle :app:assembleRelease

      - name: 收集产物
        id: apk
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/release -name '*.apk' | head -1)"
          [ -n "$apk" ] || { echo "::error::没找到 APK"; exit 1; }
          echo "path=$apk" >> "$GITHUB_OUTPUT"
          ls -lh "$apk"
          sha256sum "$apk"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: Mishka-custom-release
          path: ${{ steps.apk.outputs.path }}
          archive: false

      - name: Attach to Release（仅打 tag 时）
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk="${{ steps.apk.outputs.path }}"
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber
          else
            gh release create "$tag" "$apk" --title "$tag" --generate-notes
          fi
