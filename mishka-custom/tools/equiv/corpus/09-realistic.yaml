# 09 贴近真实订阅的片段
mixed-port: 7890
mode: rule
proxies: &proxies
  - name: 香港01
    type: ss
    server: a.example.com
  - name: 日本01
    type: vmess
    server: b.example.com
proxy-groups:
  - name: 手动
    type: select
    proxies:
      - 香港01
      - 日本01
  - name: 自动
    type: url-test
    proxies: *proxies
    url: http://www.gstatic.com/generate_204
rule-providers: &rp
  reject:
    type: http
    behavior: domain
rules:
  - RULE-SET,reject,DIRECT
dns:
  enable: true
  enhanced-mode: fake-ip
  fake-ip-filter:
    - "*.lan"
  nameserver:
    - "https://223.5.5.5/dns-query#👀 &tag=bs"
  fallback:
    - <<: *rp
