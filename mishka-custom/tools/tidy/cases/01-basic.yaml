# 顶部说明注释
# 第二行

# 贴在 port 上面的注释
socks-port: 7891
mixed-port: 7890
mode: rule
external-controller: 0.0.0.0:9090
log-level: info

dns:
  nameserver: [223.5.5.5, 119.29.29.29]
  enable: true
  enhanced-mode: fake-ip
  fallback:
    - tls://8.8.4.4
  nameserver-policy:
    geosite:cn: 223.5.5.5
    +.google.cn: 1.1.1.1

rules:
  - MATCH,PROXY
  - DOMAIN-SUFFIX,google.com,PROXY
