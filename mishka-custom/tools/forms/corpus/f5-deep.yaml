# 深层嵌套 + 引号键 + 块内注释
external-controller: 127.0.0.1:9090
external-controller-cors:
  allow-origins:
    - '*'
  allow-private-network: true

dns:
  enable: true
  # 上游服务器（保留注释）
  nameserver:
    - 223.5.5.5
  nameserver-policy:
    'geosite:cn':
      - 114.114.114.114
    'geosite:private': 223.5.5.5

listeners:
  - name: mixed-in
    type: mixed
    port: 7890
    listen: 0.0.0.0
    users:
      user1: pass1
  - name: tun-in
    type: tun
    stack: system
    'dns-hijack': ['any:53']
    mtu: 9000
