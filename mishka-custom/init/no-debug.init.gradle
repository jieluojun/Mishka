// 只出 release：命令行里点名构建 debug 变体时直接失败。
//
//   ./gradlew -I mishka-custom/init/no-debug.init.gradle :app:assembleRelease   # 正常
//   ./gradlew -I mishka-custom/init/no-debug.init.gradle :app:assembleDebug     # 直接报错
//
// 想临时放开：加 -PallowDebugBuild=true（比如给 baseline profile 用）。
// 只看「命令行点名要跑的任务」，不去翻整个任务图——release 图里本来就有
// stripReleaseDebugSymbols 这类名字带 Debug 的 release 任务，按图判定必然误伤。
def requested = gradle.startParameter.taskNames
def debugTasks = requested.findAll { name ->
    def lower = name.toLowerCase()
    lower.contains('debug') && !lower.contains('debugsymbols')
}
def allowed = gradle.startParameter.projectProperties.containsKey('allowDebugBuild')

if (!debugTasks.isEmpty() && !allowed) {
    throw new GradleException("""这个定制只构建 release 安装包（debug 包体积大得多，且不是你要的产物）。
检测到 debug 构建请求：${debugTasks.join(', ')}

  * 正常构建： ./gradlew -I mishka-custom/init/no-debug.init.gradle :app:assembleRelease
  * 确实要 debug 包：在上面命令里换成 :app:assembleDebug 并加 -PallowDebugBuild=true
""")
}

gradle.projectsLoaded {
    gradle.rootProject.allprojects { p ->
        p.tasks.matching { it.name == 'assembleDebug' || it.name == 'bundleDebug' }.configureEach { t ->
            if (!allowed) {
                t.enabled = false
            }
        }
    }
}
